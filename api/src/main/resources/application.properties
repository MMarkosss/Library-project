# 1. Conexao com o PostgreSQL via Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/livrariamarkdb
spring.datasource.username=marcos
spring.datasource.password=12345

# 2. Configuracoes do JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# 3. A MUDANCA DE PARADIGMA: O Hibernate nao cria mais as tabelas!
# Agora ele apenas "valida" se o banco esta igual ao codigo Java.
# Quem cria as tabelas agora e o Flyway.
spring.jpa.hibernate.ddl-auto=validate

# 4. Segredo do JWT (Mude isso em produção!)
api.security.token.secret=12345678

